<!DOCTYPE html>
<html lang="pt-PT" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco Hegemony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, a bank passbook. The player's class colour stripes the balance and the main button. */
:root{
  --bg:#e9edea; --surface:#ffffff; --ink:#15201b; --muted:#5a6861; --line:#cfd7d2;
  --wc:#c2352b; --on-wc:#fff; --mc:#e0b100; --on-mc:#201a00; --cc:#2059b0; --on-cc:#fff; --st:#59636e; --on-st:#fff;
  --good:#1c7f45; --bad:#b8322a; --warn-bg:#fff2c9; --warn-ink:#4d3c00;
  --cls:var(--ink); --on:var(--surface);
  --display:"Archivo",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111614; --surface:#1a211e; --ink:#e7ece9; --muted:#96a39c; --line:#2d3833;
    --wc:#e5564b; --on-wc:#1b0503; --mc:#efc21a; --on-mc:#201a00; --cc:#5a93ea; --on-cc:#04142e; --st:#9aa5b1; --on-st:#12161a;
    --good:#4cc47e; --bad:#f0736a; --warn-bg:#3d3310; --warn-ink:#f5e3a0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111614; --surface:#1a211e; --ink:#e7ece9; --muted:#96a39c; --line:#2d3833;
  --wc:#e5564b; --on-wc:#1b0503; --mc:#efc21a; --on-mc:#201a00; --cc:#5a93ea; --on-cc:#04142e; --st:#9aa5b1; --on-st:#12161a;
  --good:#4cc47e; --bad:#f0736a; --warn-bg:#3d3310; --warn-ink:#f5e3a0;
}
body[data-me="wc"]{--cls:var(--wc);--on:var(--on-wc)}
body[data-me="mc"]{--cls:var(--mc);--on:var(--on-mc)}
body[data-me="cc"]{--cls:var(--cc);--on:var(--on-cc)}
body[data-me="st"]{--cls:var(--st);--on:var(--on-st)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--cls);outline-offset:2px}
[hidden]{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:800 22px/1.1 var(--display);margin:0;letter-spacing:-.01em}
h2{font:700 13px/1 var(--display);margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pill{font:600 12px/1 var(--body);padding:6px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--good);border-color:currentColor}
.pill.off{color:var(--bad);border-color:currentColor}
#notice{background:var(--warn-bg);color:var(--warn-ink);padding:10px 12px;border-radius:8px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
/* class picker */
#classes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#classes button{background:var(--surface);border:1px solid var(--line);border-bottom:4px solid var(--c);border-radius:8px;padding:10px 2px 8px;font:700 13px/1.1 var(--display)}
#classes button[aria-pressed="true"]{background:var(--c);color:var(--oc);border-color:var(--c)}
[data-cls="wc"]{--c:var(--wc);--oc:var(--on-wc)}
[data-cls="mc"]{--c:var(--mc);--oc:var(--on-mc)}
[data-cls="cc"]{--c:var(--cc);--oc:var(--on-cc)}
[data-cls="st"]{--c:var(--st);--oc:var(--on-st)}
/* balance */
#balance{border-left:8px solid var(--cls)}
.who{font:700 15px/1 var(--display)}
.big{font:600 52px/1 var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big small{font-size:.5em;color:var(--muted);margin-left:2px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.split .big{font-size:38px}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-weight:600;font-size:14px}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
/* other balances */
#others{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tile{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;padding:8px 6px;min-width:0}
.tile b{display:block;font:600 18px/1.2 var(--num);font-variant-numeric:tabular-nums}
.tile span{display:block;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.tile .nm{font:700 11px/1.2 var(--display);color:var(--ink)}
/* pay panel */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:10px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:transparent;border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[data-cls]{border-left:6px solid var(--c)}
#amt{font:600 44px/1 var(--num);font-variant-numeric:tabular-nums;text-align:right;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#amt small{font-size:.5em;color:var(--muted)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px 0;font:600 20px/1 var(--num)}
.keys button.q{font-size:15px;color:var(--muted)}
#go{background:var(--cls);color:var(--on);border:0;border-radius:10px;padding:16px;font:800 18px/1.1 var(--display)}
#msg{font-size:14px;min-height:20px;margin:0}
#msg.err{color:var(--bad);font-weight:600}
#msg.done{color:var(--good);font-weight:600}
/* history */
#txlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
#txlist li{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
#txlist li:first-child{border-top:0}
.tx-main{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.tx-sub{font-size:12px;color:var(--muted)}
.tx-amt{font:600 16px/1 var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-amt.in{color:var(--good)} .tx-amt.out{color:var(--bad)}
li.void .tx-main,li.void .tx-amt{text-decoration:line-through;color:var(--muted)}
.mini{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;font-weight:600}
.empty{color:var(--muted);font-size:14px;margin:0}
/* new game */
details summary{font:700 15px/1 var(--display);cursor:pointer;padding:2px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input{font:600 18px/1 var(--num);padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
p.help{font-size:13px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:no-preference){button{transition:background-color .12s}}

/* v2 */
#pick .pickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pick .pickgrid button{background:var(--c);color:var(--oc);border:0;border-radius:10px;padding:22px 8px;font:800 17px/1.15 var(--display)}
#pick .pickgrid button:disabled{background:transparent;color:var(--muted);border:1px dashed var(--line);opacity:1}
#pname{font:600 18px/1.2 var(--body)}
#pick .pickgrid small{display:block;font:500 12px/1.3 var(--body);margin-top:4px}
.linkbtn{background:transparent;border:0;padding:6px 0;color:var(--muted);font-size:13px;text-decoration:underline;align-self:flex-start}
.linkbtn.armed{color:var(--bad);font-weight:600}
.ask{background:var(--warn-bg);color:var(--warn-ink);border:2px solid currentColor;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ask p{margin:0;font-size:16px}
.ask .btn{border-color:currentColor;background:var(--surface);color:var(--ink)}
.ask .btn.yes{background:var(--ink);color:var(--surface);border-color:var(--ink)}
#waiting{display:flex;flex-direction:column;gap:8px}
#inbox{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px}
#inbox .ask{width:100%;max-width:420px;padding:20px;gap:14px}
#inbox .ask p{font-size:19px}
#inbox .ask p.sub{font-size:14px}
#inbox .ask .btn{padding:14px 16px;font-size:16px;flex:1 1 auto}
.waitrow{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.polrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:14px}
.abc{display:grid;grid-template-columns:repeat(3,40px);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.abc button{background:transparent;border:0;padding:8px 0;font:600 15px/1 var(--num)}
.abc button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.step{display:grid;grid-template-columns:40px 44px 40px;align-items:center;text-align:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{background:var(--bg);border:0;padding:8px 0;font:600 18px/1 var(--num)}
.step b{font:600 17px/1 var(--num)}
.calc{font-size:14px;color:var(--muted);margin:0}
.calc b{color:var(--ink)}
.mv input{width:110px;font-size:16px;padding:9px 10px}
.paytax{background:var(--cls);color:var(--on);border:0;border-radius:10px;padding:14px;font:800 16px/1.1 var(--display)}
#toasts{position:fixed;left:0;right:0;bottom:12px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none;z-index:9}
.toast{pointer-events:auto;max-width:448px;width:100%;background:var(--ink);color:var(--surface);border-radius:10px;padding:12px 14px;font-size:15px;font-weight:500;border-left:6px solid var(--good);cursor:pointer}
.toast.err{border-left-color:var(--bad)}
#taxwin{position:fixed;inset:0;z-index:5;background:var(--bg);overflow:auto}
#taxwin .inner{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
#opentax{background:var(--surface)}
#options>div{display:flex;flex-direction:column;gap:12px}

</style>
</head>
<body>
<main>
  <header>
    <h1>Banco Hegemony</h1>
    <span id="status" class="pill">A ligar…</span>
  </header>
  <div id="notice" hidden></div>
  <div id="inbox" role="alertdialog" aria-modal="true" aria-label="Pedido de pagamento" hidden></div>
  <div id="waiting" aria-live="polite"></div>

  <section id="pick" class="card" hidden>
    <label for="pname">O teu nome<input id="pname" type="text" maxlength="20" autocomplete="off" placeholder="Escreve o teu nome"></label>
    <div class="who">Escolhe a tua classe</div>
    <p class="help" id="pickhelp"></p>
    <div class="pickgrid" id="pickgrid"></div>
    <button type="button" class="linkbtn" id="freeall">Libertar todas as classes</button>
    <button type="button" class="linkbtn" id="endgame2">Terminar jogo</button>
  </section>

  <section id="balance" class="card" aria-live="polite" hidden></section>
  <section id="others" aria-label="Saldos de todas as classes"></section>

  <section id="pay" class="card" hidden>
    <h2>Movimento</h2>
    <div class="seg" role="group" aria-label="Direção">
      <button type="button" data-dir="out" aria-pressed="true">Pagar</button>
      <button type="button" data-dir="in" aria-pressed="false">Receber</button>
      <button type="button" data-dir="prov" aria-pressed="false" hidden>Fornecer</button>
    </div>
    <div id="parties" class="chips" role="group" aria-label="Com quem"></div>
    <div id="ccin" class="row" hidden>
      <span class="lbl">Entra em</span>
      <div class="chips">
        <button type="button" class="chip" data-ccin="rev" aria-pressed="true">Receitas</button>
        <button type="button" class="chip" data-ccin="cap" aria-pressed="false">Capital</button>
      </div>
    </div>
    <div id="amt" aria-live="polite">0<small>¥</small></div>
    <div class="keys">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button><button type="button" class="q" data-add="5">+5</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button><button type="button" class="q" data-add="10">+10</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button><button type="button" class="q" data-add="25">+25</button>
      <button type="button" class="q" data-k="c" aria-label="Limpar">C</button><button type="button" data-k="0">0</button><button type="button" class="q" data-k="b" aria-label="Apagar último dígito">⌫</button><button type="button" class="q" data-add="50">+50</button>
    </div>
    <button type="button" id="go" disabled>Indica o valor</button>
  </section>

  <button type="button" class="btn" id="opentax" hidden>Impostos</button>

  <section id="history" class="card">
    <h2>Movimentos</h2>
    <ol id="txlist"></ol>
  </section>

  <details id="options" class="card" hidden>
    <summary>Opções</summary>
    <div id="newbox">
      <h2>Novo jogo</h2>
      <p class="help">Não há nenhum jogo a decorrer. Cada classe começa com estes valores.</p>
      <div class="grid2">
        <label for="s-wc">Classe Trabalhadora<input id="s-wc" type="number" inputmode="numeric" min="0" value="30"></label>
        <label for="s-mc">Classe Média<input id="s-mc" type="number" inputmode="numeric" min="0" value="40"></label>
        <label for="s-rev">Capitalista (Receitas)<input id="s-rev" type="number" inputmode="numeric" min="0" value="120"></label>
        <label for="s-st">Estado<input id="s-st" type="number" inputmode="numeric" min="0" value="120"></label>
      </div>
      <div class="row"><button type="button" class="btn" id="start">Começar novo jogo</button></div>
    </div>
    <div class="row" id="endrow"><button type="button" class="btn" id="endgame">Terminar jogo</button></div>
    <div class="row" id="freerow"><button type="button" class="btn" id="freeme">Libertar a minha classe</button></div>
  </details>
</main>
<div id="taxwin" hidden>
  <div class="inner">
    <header><h1>Impostos</h1><button type="button" class="btn" id="closetax">Fechar</button></header>
    <section id="tax" class="card"></section>
  </div>
</div>
<div id="toasts" role="status"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ====== CONFIGURAÇÃO: endereço da Realtime Database ====== */
var DATABASE_URL = "https://banco-hegemony-default-rtdb.europe-west1.firebasedatabase.app";
(function(){
"use strict";
var CLS=["wc","mc","cc","st"];
var P={
  wc:{n:"Classe Trabalhadora",N:"A Classe Trabalhadora",s:"Trabalhadora",a:"à Classe Trabalhadora",d:"da Classe Trabalhadora"},
  mc:{n:"Classe Média",N:"A Classe Média",s:"Média",a:"à Classe Média",d:"da Classe Média"},
  cc:{n:"Classe Capitalista",N:"A Classe Capitalista",s:"Capitalista",a:"à Classe Capitalista",d:"da Classe Capitalista"},
  st:{n:"Estado",N:"O Estado",s:"Estado",a:"ao Estado",d:"do Estado"},
  bank:{n:"Banco",N:"O Banco",s:"Banco",a:"ao Banco",d:"do Banco"},
  ben:{n:"Benefícios do Estado",N:"Os Benefícios do Estado",s:"Benefícios",a:"aos Benefícios",d:"dos Benefícios do Estado"}
};
var ACCT_CLS={wc:"wc",mc:"mc",rev:"cc",cap:"cc",st:"st",bank:"bank",bwc:"ben",bmc:"ben",bcc:"ben"};
/* State Benefits area of each class: money the State provided and that class has not collected yet */
var BEN={wc:"bwc",mc:"bmc",cc:"bcc"};
var ACCT_NAME={wc:"Trabalhadora",mc:"Média",rev:"Capitalista (Receitas)",cap:"Capitalista (Capital)",st:"Estado",bank:"Banco",bwc:"Benefícios (Trabalhadora)",bmc:"Benefícios (Média)",bcc:"Benefícios (Capitalista)"};
var TAGS={sal:"Salários",imp:"Impostos",com:"Compra",tax:"Taxas",jur:"Juros",loan:"Empréstimo",repay:"Liquidação de empréstimo",start:"Início",mov:"Fecho de receitas",forn:"Benefícios fornecidos",ben:"Benefícios recebidos",desc:"Benefícios descartados"};
var LOAN=50, INTEREST=5;
/* Tabelas de impostos do livro de regras */
var POLS=[["p2","2 · Mercado de Trabalho"],["p3","3 · Tributação"],["p4","4 · Saúde e Benefícios"],["p5","5 · Educação"]];
var RATE={A:{A:7,B:6,C:5},B:{A:4,B:4,C:4},C:{A:1,B:2,C:3}}; /* RATE[política 2][política 3] */
var CORP=[[300,160,120,60],[200,100,70,40],[100,40,30,20],[50,24,15,10],[25,12,10,7],[10,5,5,4],[5,1,2,2]]; /* receitas mínimas, A, B, C */

var db=null, mode="boot", readOnly=false, stale=false, staleTimer=null;
var gameId=null, gameRef=null, L={};
var txs=[], seats={}, reqs=[], pol={p2:null,p3:null,p4:null,p5:null};
var mvAmt=0;
var seen={}, primed=false, names={}, myName="";
try{ myName=(localStorage.getItem("heg-name")||"").trim().slice(0,20); }catch(e){}
function who(c){ return names[c]?names[c]+" ("+P[c].s+")":P[c].N; }
var me=null, dir="out", party="bank", ccIn="rev", amt=0, tag=null, busy=false;
var taxIn={pop:3,mcOut:0,mcOwn:0,ccOwn:4}, taxOpen=false, metaStart=0, DAY=24*60*60*1000;
var LIM={pop:[3,10],mcOut:[0,30],mcOwn:[0,30],ccOwn:[0,30]};

function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
var dev=null;
try{ dev=localStorage.getItem("heg-dev"); if(!dev){ dev="d"+rid(); localStorage.setItem("heg-dev",dev); } }catch(e){ dev=dev||"d"+rid(); }
/* Tax inputs are remembered per game on this device. */
function loadTax(gid){
  taxIn={pop:3,mcOut:0,mcOwn:0,ccOwn:4};
  try{ var tj=JSON.parse(localStorage.getItem("heg-tax")||"null"); if(tj&&tj.g===gid) Object.keys(LIM).forEach(function(k){ var n=Number(tj[k]); if(Number.isInteger(n)&&n>=LIM[k][0]&&n<=LIM[k][1]) taxIn[k]=n; }); }catch(e){}
}

function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function money(n){return n+'<small>¥</small>';}
function each(sel,fn){Array.prototype.forEach.call(document.querySelectorAll(sel),fn);}

function toast(text,err){
  var t=document.createElement("div"); t.className="toast"+(err?" err":""); t.textContent=text;
  var kill=function(){ if(t.parentNode) t.parentNode.removeChild(t); };
  t.addEventListener("click",kill); setTimeout(kill,err?9000:7000);
  $("toasts").appendChild(t);
}

function clean(id,d){
  if(!d||!(d.from in ACCT_CLS)||!(d.to in ACCT_CLS)||d.from===d.to) return null;
  var a=Number(d.amt), ts=Number(d.ts);
  if(!Number.isInteger(a)||a<=0||a>1000000||!isFinite(ts)) return null;
  var ln=(d.ln===1||d.ln===-1)&&CLS.indexOf(d.lc)>=0?d.ln:0;
  return {id:id,from:d.from,to:d.to,amt:a,ts:ts,tag:(d.tag in TAGS)?d.tag:null,by:CLS.indexOf(d.by)>=0?d.by:null,
          void:d.void===true,lc:ln?d.lc:null,ln:ln,grp:typeof d.grp==="string"?d.grp:id};
}
function cleanReq(id,d){
  if(!d||CLS.indexOf(d.from)<0||CLS.indexOf(d.to)<0||d.from===d.to) return null;
  var a=Number(d.amt); if(!Number.isInteger(a)||a<=0||a>1000000) return null;
  return {id:id,from:d.from,to:d.to,amt:a,tag:(d.tag in TAGS)?d.tag:null,inn:d.inn==="cap"?"cap":"rev",st:d.st==="no"?"no":"wait"};
}
function balances(){
  var b={wc:0,mc:0,rev:0,cap:0,st:0,bank:0,bwc:0,bmc:0,bcc:0}, l={wc:0,mc:0,cc:0,st:0};
  txs.forEach(function(t){ if(t.void) return; b[t.from]-=t.amt; b[t.to]+=t.amt; if(t.ln) l[t.lc]+=t.ln; });
  CLS.forEach(function(c){ if(l[c]<0) l[c]=0; });
  return {b:b,l:l};
}
function total(b,c){return c==="cc"?b.rev+b.cap:b[c];}
function locked(){return mode==="boot"||readOnly||!gameId||!me||busy;}

/* ---------- storage: one node per game {tx, seats, req, pol} ---------- */
function put(path,val){
  if(mode==="local"){
    var parts=path.split("/"), o=L;
    for(var i=0;i<parts.length-1;i++){ if(typeof o[parts[i]]!=="object"||!o[parts[i]]) o[parts[i]]={}; o=o[parts[i]]; }
    if(val===null) delete o[parts[parts.length-1]]; else o[parts[parts.length-1]]=val;
    applyGame(L); return Promise.resolve();
  }
  return gameRef.child(path).set(val);
}
function applyGame(g){
  g=g||{};
  var tx=g.tx||{}, list=Object.keys(tx).map(function(k){return clean(k,tx[k]);}).filter(Boolean);
  seats={}; me=null;
  CLS.forEach(function(c){ if(g.seats&&typeof g.seats[c]==="string"){ seats[c]=g.seats[c]; if(seats[c]===dev) me=c; } });
  names={}; CLS.forEach(function(c){ var nm=g.names?g.names[c]:null; if(typeof nm==="string"&&nm.trim()) names[c]=nm.trim().slice(0,20); });
  var rq=g.req||{}; reqs=Object.keys(rq).map(function(k){return cleanReq(k,rq[k]);}).filter(Boolean);
  ["p2","p3","p4","p5"].forEach(function(k){ var v=g.pol?g.pol[k]:null; pol[k]=(v==="A"||v==="B"||v==="C")?v:null; });
  notify(list); txs=list; render();
}
/* Tell this player about money that arrived and about cancelled movements. */
function notify(list){
  if(!primed){ list.forEach(function(t){seen[t.id]=t.void;}); primed=true; return; }
  var inc={};
  list.forEach(function(t){
    var mine=me&&(ACCT_CLS[t.to]===me||ACCT_CLS[t.from]===me);
    if(!(t.id in seen)){
      if(me&&BEN[me]&&t.to===BEN[me]&&!t.void) toast("O Estado forneceu-te "+t.amt+"¥. Toca em «Receber» quando os quiseres levantar.");
      if(me&&ACCT_CLS[t.to]===me&&ACCT_CLS[t.from]!==me&&t.by!==me&&!t.void&&t.tag!=="start"){
        var k=t.grp; if(!inc[k]) inc[k]={amt:0,from:ACCT_CLS[t.from],tag:t.tag}; inc[k].amt+=t.amt;
      }
    }else if(seen[t.id]!==t.void&&mine&&t.by!==me&&t.by){
      toast(who(t.by)+(t.void?" anulou":" repôs")+" o movimento de "+t.amt+"¥ ("+ACCT_NAME[t.from]+" → "+ACCT_NAME[t.to]+").",t.void);
    }
    seen[t.id]=t.void;
  });
  Object.keys(inc).forEach(function(k){ var i=inc[k]; toast("Recebeste "+i.amt+"¥ "+(names[i.from]?"de "+who(i.from):P[i.from].d)+(i.tag?" ("+TAGS[i.tag]+")":"")+"."); });
}
function writeFailed(e){
  if(e&&/PERMISSION_DENIED/i.test(String(e.code||e.message||e))) readOnly=true;
  else toast("Não consegui gravar. Verifica a ligação e tenta outra vez.",true);
}

/* Move money between two parties. The Capitalist pays from Receitas first, then Capital (loans: Capital first). */
function transfer(fromP,toP,n,tg,o){
  o=o||{};
  var b=balances().b, legs=[];
  if(fromP==="bank"){ legs.push(["bank",n]); }
  else{
    var have=total(b,fromP);
    if(have<n){
      toast((fromP===me?"Só tens ":P[fromP].N+" só tem ")+have+"¥."+(fromP===me?" Pede um empréstimo ao Banco.":""),true);
      return Promise.resolve(false);
    }
    if(fromP==="cc"){
      var first=o.capFirst?"cap":"rev", second=o.capFirst?"rev":"cap", r=Math.min(Math.max(b[first],0),n);
      if(r>0) legs.push([first,r]); if(n-r>0) legs.push([second,n-r]);
    }else legs.push([fromP,n]);
  }
  var to=o.toAcct||(toP==="cc"?(o.loan?"cap":(me==="cc"?ccIn:"rev")):toP);
  var grp=rid();
  busy=true; render();
  var p=Promise.resolve();
  legs.forEach(function(leg,i){
    p=p.then(function(){
      var d={from:leg[0],to:to,amt:leg[1],ts:Date.now(),by:me,void:false,grp:grp};
      if(tg) d.tag=tg;
      if(o.loan&&i===0){ d.lc=o.loan.c; d.ln=o.loan.n; }
      return put("tx/"+rid(),d);
    });
  });
  return p.then(function(){busy=false;return true;},function(e){busy=false;writeFailed(e);return false;}).then(function(ok){render();return ok;});
}

/* ---------- State Benefits ---------- */
/* The State moves money from its Treasury into a class's State Benefits area. Anything already there is discarded first. */
function provide(c,n){
  var b=balances().b, k=BEN[c];
  if(!k) return Promise.resolve(false);
  if(b.st<n){ toast("O Estado só tem "+b.st+"¥.",true); return Promise.resolve(false); }
  var grp=rid(), old=b[k];
  busy=true; render();
  var p=Promise.resolve();
  if(old>0) p=p.then(function(){ return put("tx/"+rid(),{from:k,to:"bank",amt:old,tag:"desc",ts:Date.now(),by:me,void:false,grp:grp}); });
  p=p.then(function(){ return put("tx/"+rid(),{from:"st",to:k,amt:n,tag:"forn",ts:Date.now(),by:me,void:false,grp:grp}); });
  return p.then(function(){ busy=false; toast("Forneceste "+n+"¥ "+P[c].a+"."+(old>0?" Os "+old+"¥ que lá estavam foram descartados.":"")); return true; },
                function(e){ busy=false; writeFailed(e); return false; }).then(function(ok){ render(); return ok; });
}
function collect(){
  var k=BEN[me], n=k?balances().b[k]:0;
  if(n<=0) return;
  busy=true; render();
  put("tx/"+rid(),{from:k,to:me==="cc"?"rev":me,amt:n,tag:"ben",ts:Date.now(),by:me,void:false})
    .then(function(){ busy=false; toast("Recebeste "+n+"¥ dos Benefícios do Estado. O Estado ganha 1 PV."); },function(e){ busy=false; writeFailed(e); }).then(render);
}

/* ---------- taxes ---------- */
function polReady(){return pol.p2&&pol.p3&&pol.p4&&pol.p5;}
function multiplier(){ var m={A:2,B:1,C:0}; return {A:3,B:2,C:1}[pol.p3]+(m[pol.p4]+m[pol.p5])*m[pol.p3]; }
function corpTax(rev,p3){ var i={A:1,B:2,C:3}[p3]; for(var k=0;k<CORP.length;k++) if(rev>=CORP[k][0]) return CORP[k][i]; return 0; }
function taxCalc(b){
  var r=RATE[pol.p2][pol.p3], m=multiplier(), parts=[];
  if(me==="wc") parts.push(["Rendimento: "+taxIn.pop+" de população × "+r,r*taxIn.pop]);
  if(me==="mc"){ parts.push(["Rendimento: "+taxIn.mcOut+" empresas × "+r,r*taxIn.mcOut]); parts.push(["Emprego: "+taxIn.mcOwn+" empresas × "+m,m*taxIn.mcOwn]); }
  if(me==="cc"){
    var emp=m*taxIn.ccOwn, base=Math.max(b.rev-emp,0);
    parts.push(["Emprego: "+taxIn.ccOwn+" empresas × "+m,emp]);
    parts.push(["Lucros: sobre "+base+"¥ de Receitas",corpTax(base,pol.p3)]);
  }
  return {parts:parts,total:parts.reduce(function(s,p){return s+p[1];},0)};
}
function payTax(){
  var b=balances().b, c=taxCalc(b);
  if(c.total<=0) return;
  if(total(b,me)<c.total){ toast("Deves "+c.total+"¥ de impostos e só tens "+total(b,me)+"¥. Pede um empréstimo ao Banco.",true); return; }
  var p=Promise.resolve(true);
  c.parts.forEach(function(part){ if(part[1]>0) p=p.then(function(ok){ return ok?transfer(me,"st",part[1],"imp"):false; }); });
  p.then(function(ok){ if(ok){ taxOpen=false; toast("Pagaste "+c.total+"¥ de impostos ao Estado."); render(); } });
}

/* ---------- game ---------- */
function useGame(gid){
  if(gid===gameId) return;
  if(gameRef){ gameRef.off(); gameRef=null; }
  gameId=gid; txs=[]; seats={}; reqs=[]; names={}; me=null; seen={}; primed=false; L={}; taxOpen=false; amt=0; tag=null;
  pol={p2:null,p3:null,p4:null,p5:null}; loadTax(gid);
  if(mode==="sync"&&gid){
    gameRef=db.ref("hegemony/games/"+gid);
    gameRef.on("value",function(snap){ applyGame(snap.val()); },function(){ readOnly=true; render(); });
  }
  render();
}
function startGame(){
  var v={wc:"s-wc",mc:"s-mc",rev:"s-rev",st:"s-st"}, start=[];
  Object.keys(v).forEach(function(k){ var n=Math.floor(Number($(v[k]).value)); if(n>0&&n<=1000000) start.push([k,n]); });
  var gid="g"+Date.now().toString(36); metaStart=Date.now();
  busy=true; render();
  var p=mode==="sync"?db.ref("hegemony/meta").set({gameId:gid,startedAt:Date.now()}):Promise.resolve();
  return p.then(function(){
    useGame(gid);
    var q=Promise.resolve();
    start.forEach(function(s){ q=q.then(function(){return put("tx/"+rid(),{from:"bank",to:s[0],amt:s[1],tag:"start",ts:Date.now(),void:false});}); });
    return q;
  }).then(function(){busy=false;$("options").open=false;},function(e){busy=false;writeFailed(e);}).then(render);
}
function endGame(){
  var g=gameId;
  if(mode!=="sync"){ useGame(null); return; }
  db.ref("hegemony/meta").set(null).then(function(){ return db.ref("hegemony/games/"+g).remove(); }).catch(fail);
}
function claim(c){
  if(me||busy||!gameId||seats[c]||!myName) return;
  if(mode==="local"){ put("names/"+c,myName); put("seats/"+c,dev); return; }
  busy=true;
  gameRef.child("seats/"+c).transaction(function(cur){ if(cur===null||cur===dev) return dev; })
    .then(function(res){ busy=false; if(!res.committed) toast("Essa classe acabou de ser escolhida por outro jogador.",true); else put("names/"+c,myName).catch(fail); render(); },
          function(e){ busy=false; writeFailed(e); render(); });
}
function armStale(){ clearTimeout(staleTimer); staleTimer=setTimeout(function(){stale=true;render();},10000); }
function clearStale(){ clearTimeout(staleTimer); stale=false; }
function init(){
  if(!DATABASE_URL||!window.firebase){ mode="local"; render(); return; }
  try{ firebase.initializeApp({databaseURL:DATABASE_URL}); db=firebase.database(); }
  catch(e){ mode="local"; render(); return; }
  mode="sync"; armStale();
  var was=false;
  db.ref(".info/connected").on("value",function(snap){
    if(snap.val()===true){ was=true; clearStale(); } else if(was){ stale=true; }
    render();
  });
  db.ref("hegemony/meta").on("value",function(snap){
    var v=snap.val(), g=v?v.gameId:null;
    var at=v?Number(v.startedAt):0;
    /* a game ends by itself one day after it started */
    if(typeof g==="string"&&/^[a-z0-9]{2,40}$/.test(g)&&Date.now()-at<DAY){ metaStart=at; useGame(g); }
    else useGame(null);
    render();
  },function(){ readOnly=true; render(); });
  render();
}

/* ---------- events ---------- */
var armed=null, armTimer=null;
function confirmTap(el,label){
  if(armed===el){ disarm(); return true; }
  disarm(); armed=el; el.dataset.label=el.textContent; el.textContent=label; el.classList.add("armed");
  armTimer=setTimeout(disarm,3000); return false;
}
function disarm(){ clearTimeout(armTimer); if(armed&&armed.isConnected){ armed.textContent=armed.dataset.label; armed.classList.remove("armed"); } armed=null; }
function findReq(id){ return reqs.filter(function(r){return r.id===id;})[0]; }
function fail(e){ writeFailed(e); render(); }

document.addEventListener("click",function(ev){
  var el=ev.target.closest("button"); if(!el||el.disabled) return;
  var d=el.dataset;
  if(el!==armed) disarm();

  if(d.claim){ claim(d.claim); return; }
  if(el.id==="freeall"){ if(confirmTap(el,"Confirmar: libertar todas as classes?")) { put("seats",null).catch(fail); put("names",null).catch(fail); } return; }
  if(el.id==="start"){ if(!gameId) startGame(); return; }
  if(el.id==="endgame"||el.id==="endgame2"){ if(gameId&&confirmTap(el,"Confirmar: terminar o jogo para todos?")) endGame(); return; }
  if(!me) return; /* nothing else works without a class */

  if(el.id==="opentax"){ taxOpen=true; render(); }
  else if(el.id==="closetax"){ taxOpen=false; render(); }
  else if(el.id==="freeme"){ if(confirmTap(el,"Confirmar: libertar a minha classe?")) { var c0=me; put("names/"+c0,null).catch(fail); put("seats/"+c0,null).catch(fail); } }
  else if(d.dir){ dir=d.dir; render(); }
  else if(d.party){ party=d.party; render(); }
  else if(d.ccin){ ccIn=d.ccin; render(); }
  else if(d.tag){ tag=tag===d.tag?null:d.tag; render(); }
  else if(d.k){ if(d.k==="c") amt=0; else if(d.k==="b") amt=Math.floor(amt/10); else if(amt<10000) amt=amt*10+Number(d.k); render(); }
  else if(d.add){ amt=Math.min(amt+Number(d.add),99999); render(); }
  else if(el.id==="go"){
    var n=amt;
    if(dir==="prov"){ provide(party,n).then(function(ok){ if(ok){ amt=0; render(); } }); }
    else if(dir==="in"&&party!=="bank"&&seats[party]){
      var r={from:party,to:me,amt:n,st:"wait",ts:Date.now()}; if(tag) r.tag=tag; if(me==="cc") r.inn=ccIn;
      put("req/"+rid(),r).then(function(){ amt=0; tag=null; render(); },fail);
    }else{
      var text=(dir==="out"?"Pagaste "+n+"¥ "+P[party].a:"Recebeste "+n+"¥ "+P[party].d)+".";
      transfer(dir==="out"?me:party,dir==="out"?party:me,n,tag).then(function(ok){ if(ok){ amt=0; tag=null; toast(text); render(); } });
    }
  }
  else if(d.acc){
    var q=findReq(d.acc);
    if(q&&q.from===me) transfer(me,q.to,q.amt,q.tag,{toAcct:q.to==="cc"?q.inn:null}).then(function(ok){ if(ok){ toast("Pagaste "+q.amt+"¥ "+P[q.to].a+"."); return put("req/"+q.id,null); } }).catch(fail);
  }
  else if(d.rej){ put("req/"+d.rej+"/st","no").catch(fail); }
  else if(d.del){ put("req/"+d.del,null).catch(fail); }
  else if(d.pol){ put("pol/"+d.pol,d.v).catch(fail); }
  else if(d.step){
    var k=d.step, v=taxIn[k]+Number(d.d);
    if(v>=LIM[k][0]&&v<=LIM[k][1]){ taxIn[k]=v; try{ var sv={g:gameId}; Object.keys(LIM).forEach(function(x){sv[x]=taxIn[x];}); localStorage.setItem("heg-tax",JSON.stringify(sv)); }catch(e){} render(); }
  }
  else if(d.act==="tax"){ payTax(); }
  else if(d.act==="ben"){ collect(); }
  else if(d.act==="loan"){ transfer("bank",me,LOAN,"loan",{loan:{c:me,n:1}}).then(function(ok){ if(ok) toast("Empréstimo de "+LOAN+"¥ recebido."); }); }
  else if(d.act==="repay"){ transfer(me,"bank",LOAN,"repay",{loan:{c:me,n:-1},capFirst:true}).then(function(ok){ if(ok) toast("Empréstimo liquidado."); }); }
  else if(d.act==="interest"){ var i=balances().l[me]*INTEREST; if(i>0) transfer(me,"bank",i,"jur",{capFirst:true}).then(function(ok){ if(ok) toast("Juros de "+i+"¥ pagos."); }); }
  else if(d.act==="close"||d.act==="closeall"){
    var rv=balances().b.rev, mv=d.act==="closeall"?rv:mvAmt;
    if(mv>0&&mv<=rv){ busy=true; render(); put("tx/"+rid(),{from:"rev",to:"cap",amt:mv,tag:"mov",ts:Date.now(),by:me,void:false}).then(function(){busy=false;mvAmt=0;toast(mv+"¥ passaram para Capital.");},function(e){busy=false;writeFailed(e);}).then(render); }
  }
  else if(d.void){
    var t=txs.filter(function(x){return x.id===d.void;})[0];
    if(t&&t.by===me&&(t.void||confirmTap(el,"Confirmar?"))) put("tx/"+t.id+"/void",!t.void).catch(fail);
  }
});

document.addEventListener("input",function(ev){
  if(ev.target.id!=="mvamt") return;
  var v=Math.floor(Number(ev.target.value)); mvAmt=v>0?v:0;
  var bt=document.querySelector('[data-act="close"]'), rv=balances().b.rev;
  if(bt){ bt.disabled=locked()||!(mvAmt>0)||mvAmt>rv; bt.textContent="Passar"+(mvAmt>0?" "+mvAmt+"¥":""); }
});
$("pname").value=myName;
$("pname").addEventListener("input",function(){ myName=this.value.trim().slice(0,20); try{localStorage.setItem("heg-name",myName);}catch(e){} render(); });
setInterval(function(){ if(gameId&&metaStart&&Date.now()-metaStart>=DAY) useGame(null); },60000);
render();
init();
})();
</script>
</body>
</html>
